appId: 'com.devbubble.launcher'
productName: 'DevBubble Launcher'
artifactName: 'DevBubble-Launcher-setup-${version}.${ext}'

copyright: 'Copyright © 2026 DevBubble'

publish:
  provider: 'github'
  owner: 'MrVitor0'
  repo: 'DevBubbleLauncher'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
    - target: 'zip'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'DevBubble-Launcher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'DevBubble'
  vendor: 'DevBubble'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'